name: CI

# Checks only, no deploy: develop and the release branches are never published.
# deploy.yml (push to main) stays the only workflow that touches GitHub Pages.
on:
  push:
    branches: [develop, 'release_*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # src/lib/firebase.ts imports this gitignored file; a placeholder lets
      # lint, tests and the build run without the real secret.
      - name: Placeholder Firebase config
        run: echo '{}' > firebase.config.json

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
